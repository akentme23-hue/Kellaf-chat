name: kellaf_chat
version: 1.0.0+1
description: Kellaf Chat - modern messenger for Android and Windows
publish_to: "none"

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.2
  shared_preferences: ^2.3.3
  web_socket_channel: ^3.0.1
  intl: ^0.19.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.svg
